<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dokumentasi</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #06483d;
    color: #173f36;
}

.container {
    width: 92%;
    max-width: 1000px;
    margin: auto;
    padding: 40px 0;
}

h1 {
    text-align: center;

    color: #f5dc91;

    font-family: Georgia, serif;

    font-size: clamp(30px, 7vw, 55px);

    margin-bottom: 30px;
}

.gallery {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 20px;
}

.media {
    background: #fff8df;

    border:
        3px solid #d5b45d;

    border-radius: 20px;

    padding: 18px;

    box-shadow:
        0 10px 25px #0005;
}

.media h2 {
    color: #075b4b;

    margin-bottom: 15px;

    font-size: 20px;
}

/* FOTO */

.media img {

    width: 100%;

    height: 250px;

    object-fit: cover;

    border-radius: 12px;

    display: block;
}

/* VIDEO */

.media video {

    width: 100%;

    border-radius: 12px;

    display: block;
}

/* TOMBOL KEMBALI */

.back {

    display: inline-block;

    margin-top: 25px;

    padding: 13px 20px;

    background: #f5dc91;

    color: #16483d;

    text-decoration: none;

    border-radius: 13px;

    font-weight: bold;
}

@media(max-width:650px) {

    .gallery {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<div class="container">

<h1>
DOKUMENTASI
</h1>


<div class="gallery">


<!-- =====================================
     FOTO 1
===================================== -->

<div class="media">

<h2>
📷 Foto Dokumentasi 1
</h2>

<img
src="URL_FOTO_1"
alt="Foto Dokumentasi 1">

</div>


<!-- =====================================

===================================== -->

</h2>

alt="Foto Dokumentasi 2">

</div>


<!-- =====================================
     FOTO 3
===================================== -->

<div class="media">

<h2>
📷 Foto Dokumentasi 3
</h2>

<img
src="URL_FOTO_3"
alt="Foto Dokumentasi 3">

</div>


<!-- =====================================

===================================== -->

<div class="media">

<h2>
🎥 Video Dokumentasi 1
</h2>

<video controls>

<source
src="URL_VIDEO_1"
type="video/mp4">

Browser kamu tidak mendukung video.

</video>

</div>

</div>

</a>

</div>

</body>
</html>
